<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Reado iOS lab · tab B</title>
<style>
:root{
  --accent:#2F6B4F;
  --accent-2:#3d8a66;
  --due:#FF9F0A;
  --ok:#34C759;
  --warn:#FF9F0A;
  --danger:#FF3B30;
  --level:#5856D6;
  --bg:#F2F2F7;
  --card:#fff;
  --ink:#1C1C1E;
  --muted:#8E8E93;
  --hair:#C6C6C8;
  --surface:rgba(60,60,67,.08);
  --surface-strong:rgba(60,60,67,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  background:#1a1a1c;color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 40px;
}
.lab-bar{width:min(920px,100%);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;color:#c7c7cc;font-size:12px}
.lab-bar b{color:#fff;font-weight:600}
.lab-bar .lbl{color:#8e8e93;min-width:52px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{border:0;background:#2c2c2e;color:#eee;border-radius:999px;padding:6px 10px;cursor:pointer;font:inherit}
.chip.on{background:var(--accent);color:#fff}
.lab-caption{width:min(920px,100%);color:#8e8e93;font-size:12px;line-height:1.4;margin:4px 0 16px}
.stage{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.phone{
  width:390px;height:844px;background:#000;border-radius:52px;padding:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  position:relative;
}
.phone-inner{
  height:100%;background:var(--bg);border-radius:42px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}
.phone-inner.cam{background:#000}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:20}
.status{
  height:54px;padding:14px 22px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:600;z-index:5;
}
.phone-inner.cam .status{color:#fff}
.nav{
  display:flex;align-items:center;gap:8px;padding:0 12px 8px;min-height:44px;
}
.nav h1{font-size:34px;letter-spacing:-.4px;flex:1;padding:4px 4px 0}
.nav.inline h1{font-size:17px;text-align:center;padding:0;font-weight:650}
.icon-btn{
  width:44px;height:44px;border:0;background:transparent;color:var(--accent);cursor:pointer;
  display:grid;place-items:center;border-radius:10px;font:inherit;
  -webkit-appearance:none;appearance:none;
}
.icon-btn.wide{width:auto;padding:0 8px;font-weight:650}
svg{
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.icon-btn svg{width:20px;height:20px}
.scroll{flex:1;overflow:auto;padding:0 0 12px;min-height:0}
.section-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:18px 20px 8px}
.group{margin:0 16px 12px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row + .row,.cell + .cell{border-top:0.5px solid var(--hair)}
.row svg{width:20px;height:20px;flex-shrink:0}
.cell{padding:12px 14px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.tiny{color:#aeaeb2;font-size:11px}
.title{font-weight:600}
.chev{color:#c7c7cc;margin-left:auto}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-strong);white-space:nowrap}
.badge{
  font-weight:650;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:999px;
  background:rgba(255,159,10,.18);color:#c93400;font-size:11px;white-space:nowrap;flex-shrink:0;
}
.hero-ico{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
.hero-ico svg{width:20px;height:20px;stroke:#fff}
.cta-dock{padding:8px 16px 12px;background:rgba(242,242,247,.82);backdrop-filter:blur(16px);border-top:0.5px solid rgba(0,0,0,.06)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary svg{stroke:#fff}
.btn-outline{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn-ghost{background:var(--surface-strong);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px;padding:20px}
.sheet-nav{display:flex;align-items:center;padding:8px 8px 10px}
.sheet-nav .title{flex:1;text-align:center;font-size:17px}
.seg{padding:2px 0 14px;cursor:pointer;touch-action:manipulation}
.seg-head{display:flex;align-items:flex-start;gap:2px}
.seg-head .en{flex:1;min-width:0;font-size:16px}
.seg .vi{font-size:15px;color:var(--muted);margin-top:6px;padding-right:28px}
.seg-vi{
  flex-shrink:0;border:0;background:transparent;color:var(--muted);
  font:600 10px/1 inherit;letter-spacing:.04em;
  padding:4px 2px;min-width:28px;min-height:36px;
  cursor:pointer;touch-action:manipulation;opacity:.42;
  -webkit-appearance:none;appearance:none;
}
.seg-vi.on{color:var(--accent);opacity:1}
.group .seg{padding:0}
.vrow{display:flex;gap:10px;align-items:flex-start}
.check{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--hair);flex-shrink:0;display:grid;place-items:center;background:#fff;cursor:pointer}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.term{font-weight:650}
.pos{font-size:12px;color:var(--muted);background:var(--surface-strong);padding:2px 7px;border-radius:999px}
.verify{font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.verify.ok{color:var(--ok)} .verify.warn{color:var(--warn)} .verify.bad{color:var(--danger)}
.editor{margin:8px 0 4px 34px;display:flex;flex-direction:column;gap:8px}
.editor label{font-size:12px;color:var(--muted)}
.editor input,.editor select,.editor textarea{
  width:100%;border:0;background:var(--surface);border-radius:8px;padding:8px;font:inherit
}
.card-stage{flex:1;display:flex;flex-direction:column;padding:12px 16px 8px;min-height:0}
.flash{
  flex:1;margin:8px 0;background:#fff;border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);display:grid;place-items:center;padding:24px;cursor:pointer;
}
.flash .word{font-size:28px;font-weight:700;text-align:center}
.flash .back{text-align:left;width:100%}
.grades{display:flex;gap:10px;padding:8px 16px 12px}
.grades button{flex:1;border:0;border-radius:8px;padding:10px 0;font:600 13px/1 inherit;cursor:pointer}
.g-again{background:rgba(255,59,48,.12);color:var(--danger)}
.g-hard{background:var(--surface-strong);color:var(--ink)}
.g-good{background:rgba(47,107,79,.18);color:var(--accent)}
.g-easy{background:var(--accent);color:#fff}
.hint{text-align:center;color:#aeaeb2;font-size:12px;padding-bottom:8px}
.heatmap{display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
.heat{aspect-ratio:1;border-radius:2px;background:var(--surface-strong)}
.heat.l1{background:#c6e6d4}.heat.l2{background:#7cbc96}.heat.l3{background:var(--accent)}
.field{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:12px}
.field-num{
  width:88px;border:0;background:var(--surface);border-radius:8px;
  padding:8px 10px;font:inherit;text-align:right;color:var(--ink);
  -webkit-appearance:none;appearance:none;
}
.field-edit{display:flex;align-items:center;gap:6px;flex-shrink:0}
.field .unit{color:var(--muted);font-size:13px}
.btn[disabled]{opacity:.38;pointer-events:none}
.note{padding:8px 32px 20px;color:var(--muted);font-size:12px}

/* Capture — Apple Camera */
.viewfinder{

}
.vf-grid{
  position:absolute;inset:0;pointer-events:none;

    linear-gradient(to bottom, transparent 0, transparent calc(33.333% - 0.5px), rgba(255,255,255,.22) calc(33.333% - 0.5px), rgba(255,255,255,.22) calc(33.333% + 0.5px), transparent calc(33.333% + 0.5px), transparent calc(66.666% - 0.5px), rgba(255,255,255,.22) calc(66.666% - 0.5px), rgba(255,255,255,.22) calc(66.666% + 0.5px), transparent calc(66.666% + 0.5px));
}
.cam-bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:14px 28px 10px;background:#000;
}
.thumb{
  justify-self:start;width:36px;height:36px;border-radius:8px;padding:2px;
  background:#3a3a3c;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;
}
.thumb-page{
  width:100%;height:100%;border-radius:5px;
  background:

    linear-gradient(180deg,#efe6d6,#d9cfba);
}
.shutter,.float-shutter{
  width:64px;height:64px;border-radius:50%;border:2px solid #fff;background:transparent;
  padding:5px;display:grid;place-items:center;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.shutter-core{width:100%;height:100%;border-radius:50%;background:#fff;display:block}
.cam-spacer{width:36px;height:36px;justify-self:end}
.cam-dest{
  display:flex;align-items:center;gap:8px;padding:6px 16px 8px;background:#000;flex-shrink:0;
}
.cam-dest-pick{
  flex:1;border:0;background:#2c2c2e;color:#fff;border-radius:10px;
  padding:10px 12px;font:inherit;font-weight:600;text-align:left;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.cam-dest-pick .tiny{color:#8e8e93}
.cam-dest-add{
  width:44px;height:44px;border:0;background:#2c2c2e;color:#fff;border-radius:10px;
  display:grid;place-items:center;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.cam-dest-add svg{width:18px;height:18px}

.float-shutter{
  position:absolute;left:50%;bottom:84px;transform:translateX(-50%);
  z-index:12;border-color:#1c1c1e;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.phone-inner.has-float .scroll{padding-bottom:80px}

/* Tab bar — 3 mục phẳng */
.tabbar{
  display:flex;align-items:flex-end;padding:6px 4px 22px;
  background:rgba(249,249,249,.94);backdrop-filter:blur(16px);
  border-top:0.5px solid var(--hair);position:relative;z-index:8;
  overflow:visible;flex-shrink:0;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);background:none;border:0;cursor:pointer;
  font:inherit;font-size:10px;min-height:44px;justify-content:flex-end;padding-bottom:2px;
  -webkit-appearance:none;appearance:none;
}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* Kho cards */
.col-card{
  display:flex;flex-direction:column;gap:4px;width:calc(100% - 32px);
  margin:0 16px 10px;padding:14px;background:var(--card);border-radius:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.col-card-top{display:flex;align-items:center;gap:8px}
.col-card-top .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-card-hit{
  display:flex;flex-direction:column;gap:4px;width:100%;padding:0;border:0;
  background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.col-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}

/* Hub */
.hub-hero{padding:8px 20px 12px}
.hub-hero h2{font-size:28px;letter-spacing:-.4px;font-weight:700}
.hub-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.hub-meta span{font-size:13px;color:var(--muted)}
.hub-meta .badge{color:#c93400}
.hub-actions{display:grid;grid-template-columns:1fr;gap:10px;padding:0 16px 16px}
.hub-actions .btn{padding:11px 12px;font-size:14px}
.session-card{
  width:calc(100% - 32px);margin:0 16px 10px;padding:14px;background:var(--card);
  border-radius:14px;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.vocab-line{
  display:flex;align-items:baseline;gap:8px;padding:11px 14px;width:100%;
  background:var(--card);border:0;text-align:left;font:inherit;color:inherit;
}
.vocab-line .meaning{color:var(--muted);font-size:13px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-row{display:flex;gap:14px;padding:14px;align-items:center}
.level-row{display:flex;gap:6px;padding:10px 0 0;flex-wrap:nowrap}
.level-chip{
  flex:1;border:0;background:var(--surface);border-radius:8px;padding:8px 0;
  font:650 12px/1 inherit;cursor:pointer;color:var(--ink);
  -webkit-appearance:none;appearance:none;
}
.level-chip.on{background:var(--accent);color:#fff}
.theme-dot{
  width:36px;height:36px;border-radius:18px;border:0;cursor:pointer;padding:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.theme-dot.on{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink)}
.scope-sheet{margin:0 16px 10px;background:var(--card);border-radius:12px;overflow:hidden}
.sheet-nav .title-btn{
  flex:1;border:0;background:transparent;font:inherit;font-weight:650;font-size:17px;
  cursor:pointer;color:var(--ink);text-align:center;
}
.bar-track{height:8px;background:var(--surface-strong);border-radius:4px;margin-top:6px}
.bar-fill{height:8px;background:var(--accent);border-radius:4px}
.agent-pick{display:flex;align-items:center;gap:8px;padding:10px 14px}

.agent-tools{display:flex;gap:4px}
.agent-tools .icon-btn{width:40px;height:40px;color:var(--ink);background:var(--surface)}
.agent-tools .icon-btn.dim{opacity:.32;pointer-events:none}
.float-mask{
  position:absolute;inset:0;background:rgba(28,28,30,.28);z-index:14;border:0;
  cursor:pointer;-webkit-appearance:none;appearance:none;
}
.float-card{
  position:absolute;left:14px;right:14px;bottom:92px;z-index:15;
  background:#fff;border-radius:18px;padding:16px 16px 14px;
  box-shadow:0 18px 48px rgba(0,0,0,.22);

.float-card h3{font-size:17px;font-weight:650;margin-bottom:12px}
.float-card label{font-size:11px;color:var(--muted);display:block;margin:10px 0 4px}
.float-card input{
  width:100%;border:0;background:var(--surface);border-radius:8px;padding:10px;font:inherit
}
.float-actions{display:flex;gap:8px;margin-top:14px}
</style>
</head>

const tabOf = {
  home:"home", settings:"home", data:"home", streak:"home",
  review:"review",
  capture:"capture", analysis:"capture",
  kho:"kho", collection:"kho", read:"kho"
};
const peekRoutes = new Set(["home","kho","collection"]);

function go(r){
  if (r !== "review"){ reviewLive = null; showScopePicker = false; }
  if (r !== "settings") agentSheet = null;
  if (r !== "capture") destSheet = null;
  if (r === "review" && route !== "review"){ flipped = false; cardI = 0; }
  if (r === "analysis" && route !== "analysis") applyLevelChecks();
  route = r;
  render();
}
function destCol(){
  return collections.find(c=>c.id===dest) || collections.find(c=>c.def) || collections[0];
}
function openCapture(){
  destSheet = null;
  if (route === "collection") dest = hubId;
  else if (route !== "analysis" && route !== "capture") dest = "inbox";
  go("capture");
}
function setDest(id){
  dest = id;
  destSheet = null;
  render();
}
function saveNewCollection(){
  const name = ((destSheet && destSheet.name) || "").trim() || "Không tên";
  const id = "c"+Date.now();
  collections.push({id, name, def:false, words:0, due:0, last:"23 Thg 9", pinned:false});
  dest = id;
  destSheet = null;
  render();
}
function saveVocab(){
  const c = destCol();
  dest = c.id;
  hubId = c.id;
  hubBack = "kho";
  alert("Đã lưu "+selectedCount()+" từ vào «"+c.name+"».");
  go("collection");
}
function destFloat(){
  if (route !== "capture" || !destSheet) return "";
  const mask = `<button class="float-mask" onclick="destSheet=null;render()" aria-label="Đóng"></button>`;
  if (destSheet === "pick"){
    const rows = collections.map(c=>`
      <button class="row" onclick="setDest('${c.id}')">
        <div class="grow">
          <div class="title">${c.name}</div>
          <div class="tiny">${c.def?"Mặc định · không chọn thì vào đây":c.words+" từ"}</div>
        </div>
        <span style="color:var(--accent)">${dest===c.id?"●":"○"}</span>
      </button>`).join("");
    return `${mask}
    <div class="float-card">
      <h3>Lưu trang vào</h3>
      <div class="group" style="margin:0">${rows}</div>
    </div>`;
  }
  const name = destSheet.name || "";
  return `${mask}
  <div class="float-card">
    <h3>Tạo collection</h3>
    <label>Tên</label>
    <input value="${name}" placeholder="Tên sách / mảng việc" oninput="destSheet.name=this.value">
    <div class="float-actions">
      <button class="btn btn-ghost" onclick="destSheet=null;render()">Huỷ</button>
      <button class="btn btn-primary" onclick="saveNewCollection()">Tạo</button>
    </div>
  </div>`;
}
function goReview(scope){
  if (scope === undefined) reviewLive = null;
  else if (scope === "all") reviewLive = "all";
  else reviewLive = [scope];
  flipped = false;
  cardI = 0;
  showScopePicker = false;
  route = "review";
  render();
}
function accentHex(){
  return (themes.find(t=>t.id===themeId) || themes[0]).accent;
}
function applyTheme(){
  document.documentElement.style.setProperty("--accent", accentHex());
}
function currentIds(){
  if (reviewLive === "all") return "all";
  if (Array.isArray(reviewLive) && reviewLive.length) return reviewLive;
  if (reviewAll) return "all";
  return reviewPriorities.length ? reviewPriorities : "all";
}
function scopeTitle(){
  const ids = currentIds();
  if (ids === "all") return "Tất cả kho";
  const names = ids.map(id => collections.find(c=>c.id===id)?.name).filter(Boolean);
  if (!names.length) return "Tất cả kho";
  if (names.length === 1) return names[0];
  if (names.length === 2) return names.join(" · ");
  return names[0] + " +" + (names.length - 1);
}
function scopeDue(){
  const ids = currentIds();
  if (ids === "all") return collections.reduce((s,c)=>s+c.due,0);
  return ids.reduce((s,id)=>s+(collections.find(c=>c.id===id)?.due||0),0);
}
function isPicked(id){
  const ids = currentIds();
  if (ids === "all") return false;
  return ids.includes(id);
}
function togglePriority(id){
  reviewAll = false;
  let arr = currentIds() === "all" ? [] : [...currentIds()];
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1);
  else {
    if (arr.length >= 3){ alert("Ưu tiên tối đa 3 collection."); return; }
    arr.push(id);
  }
  if (!arr.length){ reviewAll = true; reviewPriorities = []; reviewLive = "all"; }
  else { reviewPriorities = arr; reviewLive = arr; }
  render();
}
function setReviewAll(){
  reviewAll = true;
  reviewPriorities = [];
  reviewLive = "all";
  render();
}
function togglePin(id){
  const x = collections.find(z=>z.id===id);
  if (!x || x.def) return;
  if (!x.pinned && collections.filter(z=>z.pinned && !z.def).length >= HOME_PIN_MAX){
    alert("Tối đa "+HOME_PIN_MAX+" collection ghim trên Home.");
    return;
  }
  x.pinned = !x.pinned;
  render();
}
function openHub(id){
  hubBack = (route === "home") ? "home" : "kho";
  hubId = id;
  go("collection");
}
function selectedCount(){ return drafts.filter(d=>d.sel).length; }
function applyLevelChecks(){
  drafts.forEach(d => d.sel = cefrLevels.includes(d.cefr));
}
function toggleCefr(lv){
  const i = cefrLevels.indexOf(lv);
  if (i >= 0){
    if (cefrLevels.length === 1) return;
    cefrLevels.splice(i, 1);
  } else cefrLevels.push(lv);
  render();
}
function toggleSelectAllDrafts(){
  const all = drafts.length && drafts.every(d=>d.sel);
  drafts.forEach(d => d.sel = !all);
  render();
}
function toggleSeg(i){
  const n = openVi.indexOf(i);
  if (n >= 0) openVi.splice(n, 1);
  else openVi.push(i);
  render();
}
function segBlock(en, vi, i, enStyle){
  const on = openVi.includes(i);
  const style = enStyle ? ` style="${enStyle}"` : "";
  return `<div class="seg" onclick="toggleSeg(${i})">
    <div class="seg-head">
      <div class="en"${style}>${en}</div>
      <button type="button" class="seg-vi ${on?"on":""}" onclick="event.stopPropagation();toggleSeg(${i})" aria-label="${on?"Ẩn dịch":"Hiện dịch"}" aria-pressed="${on}">dịch</button>
    </div>
    ${on?`<div class="vi">${vi}</div>`:""}
  </div>`;
}
function activeAgent(){ return agents.find(a=>a.active) || agents[0]; }
function selectAgent(id){
  agents.forEach(a=>a.active = a.id===id);
  render();
}
function openAgentAdd(){
  agentSheet = {mode:"add", name:"", base:"https://api.openai.com/v1", model:"gpt-4o-mini", keySet:false};
  render();
}
function openAgentEdit(){
  const a = activeAgent();
  if (a.kind === "proxy") return;
  agentSheet = {mode:"edit", id:a.id, name:a.name, base:a.base||"", model:a.model||"", keySet:!!a.keySet};
  render();
}
function openAgentDelete(){
  const a = activeAgent();
  if (a.kind === "proxy") return;
  agentSheet = {mode:"delete", id:a.id, name:a.name};
  render();
}
function confirmDeleteAgent(){
  const s = agentSheet;
  if (!s || s.mode !== "delete") return;
  agents = agents.filter(x=>x.id!==s.id);
  if (!agents.some(x=>x.active) && agents[0]) agents[0].active = true;
  agentSheet = null;
  render();
}
function saveAgentSheet(){
  const s = agentSheet;
  if (!s) return;
  if (s.mode === "add"){
    const id = "a"+Date.now();
    agents.forEach(x=>x.active=false);
    agents.push({id, name:s.name||"OpenAI-compat", kind:"openai_compat", base:s.base, model:s.model, keySet:!!s.keySet, active:true});
  } else {
    const a = agents.find(x=>x.id===s.id);
    if (a) Object.assign(a, {name:s.name||a.name, base:s.base, model:s.model, keySet:a.keySet||!!s.keySet});
  }
  agentSheet = null;
  render();
}
function agentFloat(){
  if (route !== "settings" || !agentSheet) return "";
  const s = agentSheet;
  const mask = `<button class="float-mask" onclick="agentSheet=null;render()" aria-label="Đóng"></button>`;
  if (s.mode === "delete"){
    return `${mask}
    <div class="float-card">
      <h3>Xoá agent?</h3>
      <p class="muted">${s.name||""} sẽ biến khỏi máy. Keychain trên máy thật cũng gỡ theo.</p>
      <div class="float-actions">
        <button class="btn btn-ghost" onclick="agentSheet=null;render()">Huỷ</button>
        <button class="btn btn-primary" style="background:var(--danger)" onclick="confirmDeleteAgent()">Xoá</button>
      </div>
    </div>`;
  }
  const heading = s.mode === "add" ? "Thêm agent" : "Sửa agent";
  return `${mask}
  <div class="float-card">
    <h3>${heading}</h3>
    <label>Tên</label>
    <input value="${s.name||""}" oninput="agentSheet.name=this.value">
    <label>Base URL</label>
    <input value="${s.base||""}" oninput="agentSheet.base=this.value">
    <label>Model</label>
    <input value="${s.model||""}" oninput="agentSheet.model=this.value">
    <label>API key</label>
    <input type="password" placeholder="${s.keySet?"•••• đã gắn Keychain":"sk-… không lưu vào lab"}" oninput="if(this.value)agentSheet.keySet=true">
    <div class="float-actions">
      <button class="btn btn-ghost" onclick="agentSheet=null;render()">Huỷ</button>
      <button class="btn btn-primary" onclick="saveAgentSheet()">Lưu</button>
    </div>
    <p class="note" style="padding:10px 0 0">Key trên máy thật vào Keychain, không SQLite, không lên server Reado.</p>
  </div>`;
}

}

function dueBadge(n){
  if (!n) return "";
  return `<span class="badge">${n} đến hạn</span>`;
}
function pillStyle(on){
  return `background:${on?accentHex():"var(--surface-strong)"};color:${on?"#fff":"inherit"}`;
}
function setFsrsRetentionPct(v){
  let n = parseInt(v, 10);
  if (Number.isNaN(n)) n = FSRS_DEFAULT.retentionPct;
  fsrsRetentionPct = Math.min(99, Math.max(70, n));
  render();
}
function setDailyNewLimit(v){
  let n = parseInt(v, 10);
  if (Number.isNaN(n)) n = LEARN_DEFAULT.newLimit;
  dailyNewLimit = Math.min(99, Math.max(1, n));
  render();
}
function setDayCutoffHour(v){
  let n = parseInt(v, 10);
  if (Number.isNaN(n)) n = LEARN_DEFAULT.cutoffHour;
  dayCutoffHour = Math.min(23, Math.max(0, n));
  render();
}
function cutoffLabel(h){
  return String(h).padStart(2,"0") + ":00";
}

function home(){
  const inbox = collections.find(c=>c.def);
  const pins = collections.filter(c=>c.pinned && !c.def);
  const scName = scopeTitle();
  const scDue = scopeDue();
  const inboxRow = `
    <button class="row" onclick="openHub('${inbox.id}')">
      <span style="color:var(--accent)">${svg.kho}</span>
      <div class="grow">
        <div style="display:flex;gap:6px;align-items:center"><span class="title">${inbox.name}</span><span class="pill">Mặc định</span></div>
        <div class="muted">${inbox.words} từ · trang chưa phân loại</div>
      </div>
      ${dueBadge(inbox.due)}
      <span class="chev">${svg.chev}</span>

  return `${status()}${navHome()}

  </div>`;

function colCard(c){
  const onOn = isPicked(c.id);
  const pin = c.def ? "" : `<button type="button" class="pill" style="${pillStyle(c.pinned)}" onclick="togglePin('${c.id}')">${c.pinned?"Home":"Ghim"}</button>`;
  return `<div class="col-card">
    <button type="button" class="col-card-hit" onclick="openHub('${c.id}')">
      <div class="col-card-top">
        <span class="title">${c.name}</span>
        ${c.def?`<span class="pill">Mặc định</span>`:""}
        ${dueBadge(c.due)}
      </div>
      <div class="muted">${c.words} từ</div>
      <div class="tiny">Thêm gần nhất ${c.last}</div>
    </button>
    <div class="col-actions">
      <button type="button" class="pill" style="${pillStyle(onOn)}" onclick="togglePriority('${c.id}')">${onOn?"Đang ôn":"Ôn nhanh"}</button>
      ${pin}
    </div>
  </div>`;
}

      <button class="row" onclick="setReviewAll()">

function analysis(){
  const segs = segments.map(([en,vi],i)=>`<div class="cell">${segBlock(en,vi,i)}</div>`).join("");
  const vocab = drafts.map(d=>{
    const badge = d.v==="ok"?`<span class="verify ok">✓ Đã kiểm</span>`:d.v==="warn"?`<span class="verify warn">⚠ Cần xem</span>`:`<span class="verify bad">? Chưa xác minh</span>`;
    const extra = d.open?"":`<div class="tiny">${d.ipa}</div><div class="tiny" style="font-style:italic">${d.example}</div>`;
    const ed = d.open?`<div class="editor">
      <label>Từ</label><input value="${d.term}">
      <label>Từ loại</label><select><option>${d.pos}</option></select>
      <label>Phiên âm (IPA)</label><input value="${d.ipa}">
      <label>Nghĩa tiếng Việt</label><input value="${d.meaning}">
      <label>CEFR</label><select><option>${d.cefr}</option></select>
      <label>Câu ví dụ</label><textarea rows="2">${d.example}</textarea>
    </div>`:"";
    return `<div class="cell">
      <div class="vrow">
        <button class="check ${d.sel?"on":""}" onclick="event.stopPropagation();drafts.find(x=>x.id===${d.id}).sel=!drafts.find(x=>x.id===${d.id}).sel;render()">${d.sel?"✓":""}</button>
        <div class="grow" onclick="const x=drafts.find(z=>z.id===${d.id});x.open=!x.open;render()" style="cursor:pointer">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <span class="term">${d.term}</span><span class="pos">${d.pos}</span><span class="pos">${d.cefr}</span>
            <span style="margin-left:auto">${badge} ▾</span>
          </div>
          <div class="muted">${d.meaning}</div>
          ${extra}
        </div>
      </div>${ed}
    </div>`;
  }).join("");
  return `${status()}
  <div class="sheet-nav">
    <button class="icon-btn" onclick="go('capture')" aria-label="Đóng">${svg.x}</button>
    <div class="title">Duyệt & lưu từ vựng</div>
    <button class="icon-btn wide" onclick="saveVocab()">Lưu (${selectedCount()})</button>
  </div>
  <div class="scroll">
    <p class="note" style="padding:8px 20px 4px">Lưu vào «${destCol().name}». Đổi bộ lúc chụp.</p>
    <div class="section-label">Bản gốc</div>
    <div class="group">${segs}</div>
    <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>Từ vựng</span>
      <span style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0">
        <button type="button" class="pill" onclick="toggleSelectAllDrafts()">${drafts.every(d=>d.sel)?"Bỏ chọn":"Chọn tất cả"}</button>
        <span>Đã chọn ${selectedCount()}/${drafts.length}</span>
      </span>
    </div>
    <div class="group">${vocab}</div>
    <div class="section-label">Ý chính</div>
    <div class="group"><div class="cell">Mô tả ngọn hải đăng cổ và người gác đèn già — công việc quen thuộc mỗi sáng đã gắn bó với ông suốt hơn bốn mươi năm.</div></div>
  </div>`;
}

function collection(){
  const c = collections.find(x=>x.id===hubId) || collections[1];
  const ghim = c.def ? "" : `<button class="pill" onclick="event.stopPropagation();togglePin('${c.id}')" style="background:${c.pinned?accentHex():"var(--surface-strong)"};color:${c.pinned?"#fff":"inherit"}">${c.pinned?"Trên Home":"Ghim Home"}</button>`;
  const vocab = drafts.map(d=>`
    <div class="vocab-line">
      <span class="term">${d.term}</span>
      <span class="pos">${d.pos}</span>
      <span class="meaning">${d.meaning}</span>
    </div>`).join("");
  const sess = sessions.map(s=>`
    <button class="session-card" onclick="go('read')">
      <div class="title">${s.date}</div>
      <div class="muted" style="margin-top:4px">${s.summary}</div>
    </button>`).join("");
  return `${status()}
  <div class="nav inline">
    <button class="icon-btn" onclick="go('${hubBack}')" aria-label="Quay lại">${svg.back}</button>
    <h1></h1>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="hub-hero">
      <h2>${c.name}</h2>
      <div class="hub-meta">
        <span>${c.words} từ</span>
        ${dueBadge(c.due)}
        ${ghim}
      </div>
    </div>
    <div class="hub-actions">
      <button class="btn btn-ghost" onclick="goReview('${c.id}')">${svg.brain} Ôn bộ này</button>
    </div>
    <div class="section-label">Phiên đọc (${sessions.length}/10)</div>
    ${sess}
    <div class="section-label">Từ vựng</div>
    <div class="group">${vocab}</div>
  </div>`;
}

function read(){
  const segs = segments.map(([en,vi],i)=>segBlock(en,vi,i,"font-size:20px")).join("");
  return `${status()}${navInline("Phiên đọc","collection")}
  <div class="scroll" style="padding:16px">
    ${segs}
    <div class="group" style="margin:20px 0">
      <button class="row" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span class="title">Ý chính</span><span class="chev">▾</span></button>
      <div class="cell muted" hidden>Mô tả ngọn hải đăng cổ và người gác đèn già — công việc quen thuộc mỗi sáng đã gắn bó với ông suốt hơn bốn mươi năm.</div>
    </div>
  </div>`;
}

function review(){
  const title = scopeTitle();
  const due = scopeDue();
  const ids = currentIds();
  if(cardI>=cards.length){
    return `${status()}
    <div class="sheet-nav"><span style="width:44px"></span><button class="title-btn" onclick="showScopePicker=!showScopePicker;render()">${title}</button><span style="width:44px"></span></div>
    <div class="stack" style="align-items:center;margin-top:80px;text-align:center">
      <div style="font-size:64px;color:var(--ok)">✓</div>
      <h2>Xong rồi!</h2>
      <p class="muted">Đã ôn hết ${cards.length} thẻ · ${title}.</p>
      <button class="btn btn-primary" onclick="go('home')">Về Home</button>
    </div>`;
  }
  const c = cards[cardI];
  const face = flipped
    ? `<div class="back"><div class="title" style="font-size:18px">${c.meaning}</div><div class="muted">${c.ipa}</div><p style="margin-top:10px;font-style:italic">${c.example}</p><hr style="border:0;border-top:0.5px solid var(--hair);margin:12px 0"><div class="tiny">${title}</div></div>`
    : `<div><div class="word">${c.term}</div><div style="text-align:center;margin-top:12px"><span class="pos">${c.pos}</span></div></div>`;
  const picker = showScopePicker ? `<div class="scope-sheet">
    <button class="row" onclick="setReviewAll()">
      <div class="grow title">Tất cả kho</div>
      <span style="color:var(--accent)">${ids==="all"?"●":"○"}</span>
    </button>
    ${collections.map(o=>`
    <button class="row" onclick="togglePriority('${o.id}')">
      <div class="grow"><div class="title">${o.name}</div><div class="muted">${o.due} đến hạn</div></div>
      <span style="color:var(--accent)">${isPicked(o.id)?"●":"○"}</span>
    </button>`).join("")}
    <div class="cell tiny">Chọn 1–3 kho ưu tiên. Tab Ôn dùng bộ này.</div>
  </div>` : "";
  return `${status()}
  <div class="sheet-nav">
    <span style="width:44px"></span>
    <button class="title-btn" onclick="showScopePicker=!showScopePicker;render()">${title}</button>
    <span style="width:44px"></span>
  </div>
  ${picker}
  <div class="card-stage">
    <div class="muted" style="display:flex;justify-content:space-between"><span>${cardI+1}/${cards.length}</span><span>${due} đến hạn</span></div>
    <div class="flash" onclick="flipped=!flipped;render()">${face}</div>
  </div>
  ${flipped?`<div class="grades">
    <button class="g-again" onclick="cardI++;flipped=false;render()">Quên</button>
    <button class="g-hard" onclick="cardI++;flipped=false;render()">Khó</button>
    <button class="g-good" onclick="cardI++;flipped=false;render()">Được</button>
    <button class="g-easy" onclick="cardI++;flipped=false;render()">Dễ</button>
  </div>`:`<div class="hint">Chạm tên kho để chọn 1–3 collection · chạm thẻ để lật</div>`}`;
}

function streak(){
  const cells = Array.from({length:126},(_,i)=>{
    const n = [0,0,0,1,2,3][Math.abs(Math.sin(i*1.7)*6|0)%6];
    return `<div class="heat ${n?("l"+n):""}"></div>`;
  }).join("");
  const ranked = [
    {name:"The Lighthouse", reviews:47},
    {name:"Kho tạm", reviews:18},
    {name:"Work emails", reviews:6}
  ];
  const maxR = ranked[0].reviews;
  const rankRows = ranked.map((r,i)=>`
    <div class="cell">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <span class="title">${i===0?"Nhiều nhất · ":""}${r.name}</span>
        <span class="muted" style="white-space:nowrap">${r.reviews} lần ôn</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.reviews/maxR*100)}%"></div></div>
    </div>`).join("");
  return `${status()}${navInline("Lịch streak","home")}
  <div class="scroll" style="padding:16px">
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <div class="group grow" style="margin:0;padding:12px"><div class="muted">Chuỗi hiện tại</div><div style="font-size:22px;font-weight:700;color:var(--due)">4 ngày</div></div>
      <div class="group grow" style="margin:0;padding:12px"><div class="muted">Dài nhất</div><div style="font-size:22px;font-weight:700;color:var(--warn)">9 ngày</div></div>
    </div>
    <div class="heatmap">${cells}</div>
    <div class="section-label" style="padding-left:0">Ôn theo collection</div>
    <div class="group" style="margin-left:0;margin-right:0">${rankRows}</div>
  </div>
  <div class="cta-dock"><button class="btn btn-primary" onclick="goReview()">Ôn tập</button></div>`;
}

function settings(){
  const themeDots = themes.map(t=>`
    <button class="theme-dot ${themeId===t.id?"on":""}" style="background:${t.accent}" onclick="themeId='${t.id}';render()" aria-label="${t.name}" title="${t.name}"></button>`).join("");
  const cur = activeAgent();
  const opts = agents.map(a=>`<option value="${a.id}" ${a.active?"selected":""}>${a.name}${a.kind==="proxy"?"":(a.keySet?" · key":" · chưa key")}</option>`).join("");
  return `${status()}
  <div class="sheet-nav"><button class="icon-btn" onclick="go('home')" aria-label="Quay lại">${svg.back}</button><div class="title">Cài đặt</div><button class="icon-btn wide">Lưu</button></div>
  <div class="scroll">
    <div class="section-label">Giao diện</div>
    <div class="group">
      <div class="theme-row">${themeDots}</div>
    </div>
    <p class="note">${themes.find(t=>t.id===themeId).name} — accent của nút, tab, shutter viền.</p>
    <div class="section-label">Agent phân tích (FR-21)</div>
    <div class="group">
      <div class="agent-pick">
        <select onchange="selectAgent(this.value)">${opts}</select>
        <div class="agent-tools">
          <button class="icon-btn" onclick="openAgentAdd()" aria-label="Thêm">${svg.plus}</button>
          <button class="icon-btn ${cur.kind==="proxy"?"dim":""}" onclick="openAgentEdit()" aria-label="Sửa">${svg.pencil}</button>
          <button class="icon-btn ${cur.kind==="proxy"?"dim":""}" onclick="openAgentDelete()" aria-label="Xoá">${svg.trash}</button>
        </div>
      </div>
    </div>
    <p class="note">${cur.kind==="proxy"?"Proxy Reado · key trên server · không sửa/xoá được.":"BYOK · "+(cur.base||"")+" · "+(cur.keySet?"key đã gắn":"chưa có key")+"."}</p>
    <div class="section-label">Học tập</div>
    <div class="group">
      <div class="cell">
        <div>Trình độ</div>
        <div class="tiny">Chọn một hoặc nhiều. Duyệt từ: check sẵn từ đúng các level này.</div>
        <div class="level-row">
          ${CEFR_LEVELS.map(lv=>`<button type="button" class="level-chip ${cefrLevels.includes(lv)?"on":""}" onclick="toggleCefr('${lv}')">${lv}</button>`).join("")}
        </div>
      </div>
      <div class="cell">
        <div class="field" style="padding:0">
          <div class="grow">
            <div>Thẻ mới mỗi ngày</div>
            <div class="tiny">mặc định ${LEARN_DEFAULT.newLimit} · 1–99</div>
          </div>
          <div class="field-edit">
            <input class="field-num" type="number" min="1" max="99" inputmode="numeric" value="${dailyNewLimit}" onchange="setDailyNewLimit(this.value)">
          </div>
        </div>
      </div>
      <div class="cell">
        <div class="field" style="padding:0">
          <div class="grow">
            <div>Giờ chuyển ngày</div>
            <div class="tiny">mặc định ${cutoffLabel(LEARN_DEFAULT.cutoffHour)} · 0–23</div>
          </div>
          <div class="field-edit">
            <input class="field-num" type="number" min="0" max="23" inputmode="numeric" value="${dayCutoffHour}" onchange="setDayCutoffHour(this.value)">
            <span class="unit">${cutoffLabel(dayCutoffHour)}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="section-label">Nhắc ôn tập</div>
    <div class="group">
      <div class="field"><span>Bật nhắc ôn tập</span>
        <button class="pill" onclick="reminderOn=!reminderOn;render()" style="background:${reminderOn?accentHex():"var(--surface-strong)"};color:${reminderOn?"#fff":"inherit"}">${reminderOn?"On":"Off"}</button>
      </div>
    </div>
    <p class="note">${reminderOn?"Nhận thông báo mỗi ngày lúc 20:00.":"Bật để nhận lời nhắc ôn từ vựng hằng ngày."}</p>
    <div class="section-label">Thuật toán ôn tập</div>
    <div class="group">
      <div class="cell">
        <div class="field" style="padding:0">
          <div class="grow">
            <div>Mục tiêu nhớ</div>
            <div class="tiny">mặc định ${FSRS_DEFAULT.retentionPct}% · 70–99</div>
          </div>
          <div class="field-edit">
            <input class="field-num" type="number" min="70" max="99" inputmode="numeric" value="${fsrsRetentionPct}" onchange="setFsrsRetentionPct(this.value)">
            <span class="unit">%</span>
          </div>
        </div>
      </div>
      <div class="field">
        <div class="grow">
          <span>Tham số FSRS</span>
          <div class="tiny">mặc định fsrs-6 · defaultWv6 · 21 trọng số</div>
        </div>
        <span class="muted">mặc định</span>
      </div>
    </div>
    <p class="note">Cao hơn 90% thì ôn dày hơn. Trọng số FSRS không mở.</p>
  </div>`;
}

function data(){
  return `${status()}
  <div class="sheet-nav"><button class="icon-btn" onclick="go('home')" aria-label="Quay lại">${svg.back}</button><div class="title">Dữ liệu</div><span style="width:44px"></span></div>
  <div class="scroll">
    <div class="section-label">Phạm vi xuất</div>
    <div class="group">
      <div class="field"><span>Chọn tất cả</span><span style="color:var(--accent)">○</span></div>
      ${collections.map(c=>`<div class="field"><div><div>${c.name}</div><div class="tiny">${c.words} từ</div></div><span style="color:var(--accent)">${c.id==="lh"?"●":"○"}</span></div>`).join("")}
    </div>
    <p class="note">Không chọn collection nào → xuất tất cả.</p>
    <div class="group">
      <button class="row"><span class="grow">Xuất CSV / TSV</span><span class="chev">${svg.chev}</span></button>
      <button class="row"><span class="grow">Xuất JSON (FSRS)</span><span class="chev">${svg.chev}</span></button>
    </div>
    <div class="group"><button class="row"><span class="grow">Nhập CSV</span><span class="chev">${svg.chev}</span></button></div>
  </div>`;
}

const views = {home,kho,capture,analysis,collection,read,review,streak,settings,data};

function render(){
  applyTheme();
  const app = document.getElementById("app");
  app.className = "phone-inner" + (route === "capture" ? " cam" : "") + (peekRoutes.has(route) ? " has-float" : "");
  app.innerHTML = views[route]() + floatShutter() + tabBar() + agentFloat() + destFloat();
  document.getElementById("chips").innerHTML = screens.map(([id,label])=>
    `<button class="chip ${route===id?"on":""}" onclick="${id==="capture"?"openCapture()":"go('"+id+"')"}">${label}</button>`
  ).join("");
}
render();
</script>
</body>
</html>
